[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nldas-ingestion"
version = "0.1.0"
description = "Ingestion pipeline for NASA NLDAS data"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "python-dotenv>=1.2",
    "earthaccess>=0.19.0",
    "requests>=2.34"
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock>=3.15"
]